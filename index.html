<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日宜</title>
<style>
:root{--red:#d4301f;--ink:#23201d;--paper:#fbf8f1;--gold:#c79a3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,#34574f,#1f372f);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.nail{position:relative;z-index:100;width:14px;height:14px;margin-bottom:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ece6d8,#6f6a60);box-shadow:0 3px 4px rgba(0,0,0,.5)}
#cal{position:relative;height:min(66vh,470px);aspect-ratio:1/1.42;max-width:88vw;border-radius:5px;cursor:pointer;box-shadow:0 2px 0 #e7dfcc,0 4px 0 #cfc5ad,0 6px 0 #e7dfcc,0 8px 0 #bdb299,0 26px 40px rgba(0,0,0,.5)}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border-radius:5px;transform-origin:14% 0}
.hd{position:relative;flex:none;height:50px;padding-top:12px;display:flex;align-items:center;justify-content:center;background:var(--red);color:var(--paper);font:600 15px/1 "Songti SC","Noto Serif SC",serif;letter-spacing:.45em;text-indent:.45em}
.hd::before{content:"";position:absolute;top:6px;left:0;right:0;height:8px;background:radial-gradient(circle,#26433d 0 3px,transparent 3.6px) 0 0/22px 8px repeat-x}
.big{flex:1;display:grid;place-items:center;text-align:center;font:900 clamp(120px,40vw,170px)/1 "Songti SC","Noto Serif SC","Source Han Serif SC",STSong,serif;color:var(--red)}
.big.fin{font-size:clamp(64px,22vw,88px);line-height:1.12;letter-spacing:.08em;text-indent:.08em}
.yj{flex:none;padding:0 22px 24px;font-size:16px;line-height:1.9;color:var(--ink)}
.yj p{display:flex;gap:10px;align-items:baseline}
.yj b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;transform:translateY(3px)}
.y{background:var(--red)}.k{background:var(--ink)}
.yj p.note{display:block;margin-top:10px;padding-right:62px;font-size:13px;line-height:1.7;color:#6f675a}
.last::after{content:"";position:absolute;left:8px;right:8px;top:58px;bottom:8px;border:1px solid var(--gold);border-radius:2px;pointer-events:none}
.seal{position:absolute;right:20px;bottom:22px;width:46px;height:62px;display:grid;place-items:center;border:3px solid var(--red);color:var(--red);font:900 22px/1.1 "Songti SC","Noto Serif SC",serif;writing-mode:vertical-rl;letter-spacing:.1em;mix-blend-mode:multiply;opacity:0}
.live .seal{animation:stamp .45s 1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-20deg)}60%{opacity:.95;transform:scale(.94) rotate(-8deg)}100%{opacity:.9;transform:scale(1) rotate(-8deg)}}
.tear{pointer-events:none;animation:tear .8s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes tear{0%{transform:none}18%{transform:rotate(3deg) translateY(-8px)}100%{transform:translate(-70px,130%) rotate(-28deg);opacity:0}}
.btn{margin-top:30px;font:15px/1 inherit;font-family:inherit;letter-spacing:.3em;text-indent:.3em;color:#ece6d8;background:transparent;border:1px solid rgba(236,230,216,.5);border-radius:999px;padding:13px 30px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@keyframes fade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.tear{animation:fade .3s forwards}.live .seal{animation:none;opacity:.9;transform:rotate(-8deg)}}
</style>
</head>
<body>
<div class="grain"></div>
<div class="nail"></div>
<div id="cal"></div>
<button class="btn" id="btn">撕下一页</button>

<script>
// 改这里：TO 是她的名字（留空则称“你”），FROM 是你的署名（留空则写“朋友”）
const TO = "", FROM = "";

const D = [
  ["又", "多睡十分钟", "假装自己不累"],
  ["长", "吃点好的", "对自己苛刻"],
  ["一", "想起老朋友", "深夜反思人生"],
  ["岁", "许愿，别太谦虚", "说“随便”"]
];
const cal = document.getElementById('cal'), btn = document.getElementById('btn');
cal.innerHTML = D.map(([c, y, k]) =>
  `<div class="pg"><div class="hd">寻常日</div><div class="big">${c}</div><div class="yj"><p><b class="y">宜</b>${y}</p><p><b class="k">忌</b>${k}</p></div></div>`
).join('') +
  `<div class="pg last"><div class="hd">${TO || '你'}的特别日</div><div class="big fin">生日<br>快乐</div><div class="yj"><p><b class="y">宜</b>收礼物，吃蛋糕，被人惦记</p><p><b class="k">忌</b>加班，谦虚，说“我没事”</p><p class="note">此页经${FROM || '朋友'}特批，全天有效。</p></div><div class="seal">大吉</div></div>`;

const pg = [...cal.children];
pg.forEach((p, j) => p.style.zIndex = pg.length - j);
let n = 0, busy = false;

function act(){
  if (busy) return;
  if (n === pg.length - 1){ reset(); return; }
  busy = true;
  pg[n].classList.add('tear'); n++;
  if (n === pg.length - 1) pg[n].classList.add('live');
  btn.textContent = n === pg.length - 1 ? '贴回去，再看一遍' : '撕下一页';
  setTimeout(() => busy = false, 700);
}
function reset(){
  pg.forEach(p => p.classList.remove('tear', 'live'));
  n = 0; btn.textContent = '撕下一页';
}
btn.onclick = act;
cal.onclick = () => { if (n < pg.length - 1) act(); };
</script>
</body>
</html>
